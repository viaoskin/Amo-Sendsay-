name: amo-to-sendsay

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: amo-to-sendsay
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python sync.py
        env:
          AMO_DOMAIN: ${{ secrets.AMO_DOMAIN }}
          AMO_TOKEN: ${{ secrets.AMO_TOKEN }}
          SENDSAY_ACC: ${{ secrets.SENDSAY_ACC }}
          SENDSAY_KEY: ${{ secrets.SENDSAY_KEY }}
